[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "thesiscircuit"
version = "0.1.0"
description = "Paper-only autonomous options research and replay system"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py==0.44.0",
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["backend*", "agents*", "strategies*", "risk*", "replay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
